<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Página inicial - SSVP</title>
    <link rel="stylesheet" href="../styles/financeiro.css">
</head>

<body>

    <header>

        <div class="header-superior">
            <ul>
                <li>
                    <button id="botaoMenu" onclick="toggleMenu()"><img src="../assets/menu-aberto.png" width="30px"
                        height="30px"></button>
                </li>
                <li>
                    <a href="inicio.html"> <img src="../assets/home.png" alt="Ínicio"></a>
                </li>
            </ul>

            <div>
                <h1 class="texto-desktop"> Sociedade São Vicente de Paulo</h1>
                <h1 class="texto-mobile">SSVP</h1>
            </div>
            <div class="menu-perfil">
                <button id="botao-menu-perfil">
                    <img id="perfil" src="../assets/perfil-abrir.png" alt="Perfil">
                </button>
            </div>
        </div>
        
        <div id="menu-perfil">
            <button id="fechar-menu">
                <img id="perfil" src="../assets/perfil-fechar.png" alt="Perfil">
            </button>

            <ul>
                <li><a href="#">Minha Conta</a></li>
                <li><a href="#">Configurações</a></li>
                <li><a href="login.html">Sair</a></li>
            </ul>
        </div>

        <div class="sidebar" id="sidebar">
            <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()"> x </a>
            <a href="financeiro.html" class="barElement">Atas e Financeiro</a>
            <a href="calendario.html" class="barElement">Calendário e Progresso</a>
            <a href="info.html" class="barElement">Dados e Orações</a>
        </div>

    </header>

    <main>

        <!-- Botões das Abas -->
        <ul class="tabs">
            <li>
                <button class="tab-btn active" data-tab="financeiro"> 
                    Financeiro
                </button>
            </li>
            <li>
                <button class="tab-btn" data-tab="atasereunioes"> 
                    Atas e Reuniões
                </button>
            </li>
        </ul>

        <!-- Conteúdo das Abas | Primário ativo-->
        <div class="tabs-conteudo">

            <div class="aba-conteudo aba-aberta" id="financeiro">
                <h2>Financeiro</h2>
                <p>Conteúdo</p>
                
            </div> 

    <div class="aba-conteudo" id="atasereunioes">
    <h2 class="titulo-central">Atas e Reuniões</h2>

    <section id="AtasReunioes" class="container-central">
    </section>

    <div class="wrapper-botao">
        <button class="btn-salvar" style="width: 250px;" onclick="abrirModal()">+ Adicionar nova Ata</button>
    </div>

    <div id="modalCadastro" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h2 style="color: #003c93; margin-bottom: 20px;">Nova Ata/Reunião</h2>
            
            <form id="formAtaReuniao">
                <div class="input-duplo">
                    <input type="text" id="NumeroAta" placeholder="Ata N° X" required>
                    <input type="number" id="Num" placeholder="N° Membros" required>
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 14px; color: #666; display: block; text-align: left;">Data da Reunião:</label>
                    <input type="date" id="dataAta" required style="width: 100%;">
                </div>

                <textarea id="inicioAta" placeholder="Início (Horário/Abertura)"></textarea>
                <textarea id="coletaAta" placeholder="Coleta na Reunião"></textarea>
                <textarea id="escalaAta" placeholder="Escala"></textarea>
                <textarea id="obrasAta" placeholder="Obras Espirituais"></textarea>
                <textarea id="pendenciasAta" placeholder="Pendências para próxima semana"></textarea>
                <textarea id="terminoAta" placeholder="Término"></textarea>
                
                <button type="submit" class="btn-salvar" style="width: 100%; margin-top: 20px;">Salvar Reunião</button>
            </form>
        </div>
    </div>
</div>
    </main>


    <footer>
        <p>&copy; 2025 SSVP - Todos os direitos reservados</p>
    </footer>

    <script src="../scripts/financeiro.js"></script>

</body>

</html>
